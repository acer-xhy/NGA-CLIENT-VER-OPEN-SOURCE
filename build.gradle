    jks_path = '../keystore/nga.jks'
}

// 版本号规则（本仓库唯一约定，以后发版只改这里的 appVersionName）：
//   versionName = MAJOR.MINOR.PATCH（语义化版本）
//   versionCode = MAJOR * 1,000,000 + MINOR * 1,000 + PATCH
//   例：6.0.0 -> 6000000；6.1.0 -> 6001000；6.1.2 -> 6001002
// 约束：MINOR、PATCH ∈ [0, 999]；versionCode ≤ 2,100,000,000（Google Play 上限）
// 由 versionName 自动推导，避免两处手改对不上
def appVersion = '6.0.0'

def versionNameToCode(String versionName) {
    def matcher = versionName =~ /\A(\d+)\.(\d+)\.(\d+)\z/
    if (!matcher.matches()) {
        throw new GradleException("versionName 必须形如 MAJOR.MINOR.PATCH：${versionName}")
    }
    int major = matcher.group(1) as int
    int minor = matcher.group(2) as int
    int patch = matcher.group(3) as int
    if (minor > 999 || patch > 999) {
        throw new GradleException("versionName 的 MINOR/PATCH 不得超过 999：${versionName}")
    }
    long code = major * 1_000_000L + minor * 1_000L + patch
    if (code > 2_100_000_000L) {
        throw new GradleException("versionCode ${code} 超出 Google Play 上限 2,100,000,000")
    }
    return code as int
}

def appVersionCodeValue = versionNameToCode(appVersion)

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        compose_version = '1.13.0'
        compose_ui_version = '1.13.0'
        compose_activity_version = '1.13.0'
        core_ktx_version = '1.19.1'
        appcompat_version = "1.8.0"
        androidx_material_version = '1.14.0'
        lifecycle_version = "2.11.1"
        retrofit_version = '3.0.0'
        paging_version = '3.5.3'
        rxjava_version = '2.2.21'
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle
        classpath libs.kotlin
    }

}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        //TODO Remove all dependencies in jcenter
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://www.jitpack.io' }
        google()
        mavenCentral()
    }

}

// release 打包不跑 lintVital。本工程 lint 的 abortOnError 已是 false，
// 即使扫出致命问题也不会中断构建，但每个模块仍会各跑一遍 lintVitalAnalyzeRelease，
// 本机实测 13 个模块合计约 233s（占任务耗时第二梯队），属于纯等待。
// 需要静态检查时显式执行 `gradlew lintRelease`，或直接用 AS 的 Inspect Code。
subprojects { p ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
        p.plugins.withId(pluginId) {
            p.extensions.getByName('android').lint.checkReleaseBuilds = false
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

project.ext {
    minSdkVersion = 31
    targetSdkVersion = 36
    compileSdkVersion = 37
    compileSdkMinor = 1
    appVersionName = appVersion
    appVersionCode = appVersionCodeValue

    rxAndroid = '2.1.1'

    room_version = "2.8.5"

    preference_version = "1.2.1"
}


