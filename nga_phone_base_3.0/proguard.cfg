# Add project specific ProGuard rules here.
# You can control the set of applied configuration files using the
# proguardFiles setting in build.gradle.
#
# For more details, see
#   http://developer.android.com/guide/developing/tools/proguard.html

# If your project uses WebView with JS, uncomment the following
# and specify the fully qualified class name to the JavaScript interface
# class:
#-keepclassmembers class fqcn.of.javascript.interface.for.webview {
#   public *;
#}

# Uncomment this to preserve the line number information for
# debugging stack traces.
#-keepattributes SourceFile,LineNumberTable

# If you keep the line number information, uncomment this to
# hide the original source file name.
#-renamesourcefileattribute SourceFile

-keepattributes SourceFile,LineNumberTable
-keepattributes Signature
-keepattributes *Annotation*
-keepattributes Exceptions
-keepattributes InnerClasses,EnclosingMethod

# ------------------------------------------------------------------
# 基线规则
# 之前 release 只挂了 'proguard.cfg'，AGP 的默认规则集（proguard-android-optimize.txt）
# 没有被引入，导致下面这些标准 keep 项全靠各库 consumer 规则零散兜底。
# 缺项曾经表现成：@JavascriptInterface 方法被裁掉（WebView 内 JS 调不到原生）、
# 枚举 values()/valueOf() 被裁、native 方法被改名、View get/set 被裁。
# ------------------------------------------------------------------
-keepclassmembers class * {
    @android.webkit.JavascriptInterface <methods>;
}

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

-keepclasseswithmembernames class * {
    native <methods>;
}

-keepclassmembers public class * extends android.view.View {
   void set*(***);
   *** get*();
}

-keepclassmembers class * extends android.app.Activity {
   public void *(android.view.View);
}

-keepclassmembers class * implements android.os.Parcelable {
  public static final android.os.Parcelable$Creator CREATOR;
}

-keepclassmembers class **.R$* {
    public static <fields>;
}

-keep class * implements android.os.Parcelable {*;}
-keep class * implements java.io.Serializable { *; }

-keep public class * extends android.app.Application
-keep public class * extends android.app.Activity

-keep class sp.phone.view.webview.LocalWebView{*;}

# WebView JS 桥（FunctionUtils 里 addJavascriptInterface 注册的 "ProxyBridge"），
# 方法名就是 JS 侧调用的名字，整类保留避免被裁剪/合并后 JS 调用失效。
-keep class sp.phone.proxy.ProxyBridge { *; }

# 三方控件被反射写的私有字段，字段名不能改名（否则 getDeclaredField 抛 NoSuchFieldException，
# 表现为 LoadToast 只能退化成全局 toast、SignSeekBar 的 thumb 半径属性失效）。
-keepclassmembers class net.steamcrafted.loadtoast.LoadToast {
    android.view.ViewGroup mParentView;
}
-keepclassmembers class com.zhouyou.view.seekbar.SignSeekBar {
    int mThumbRadiusOnDragging;
}

-keep public class com.alibaba.android.arouter.routes.**{*;}
-keep public class com.alibaba.android.arouter.facade.**{*;}
-keep class * implements com.alibaba.android.arouter.facade.template.ISyringe{*;}

# If you use the byType method to obtain Service, add the following rules to protect the interface:
-keep interface * implements com.alibaba.android.arouter.facade.template.IProvider

# If single-type injection is used, that is, no interface is defined to implement IProvider, the following rules need to be added to protect the implementation
# 保留所有 IProvider 实现类：ARouter 生成的路由表里存的是实现类名字符串，
# 被 R8 改名后 Class.forName 会失败，启动时报 "Init provider failed!"
-keep class * implements com.alibaba.android.arouter.facade.template.IProvider { *; }

# fastjson
-keep class com.alibaba.fastjson.**{*;}
-keep class com.alibaba.fastjson2.**{*;}

# Retrofit
-keep class retrofit2.** { *; }

# R8 full mode 会剥掉「泛型签名里引用了未被 keep 的类型」的 Signature 属性。
# Retrofit 运行时通过反射读接口方法的泛型，被剥掉后会出现
# "Observable return type must be parameterized"（release 包启动即崩）。
# 下面这些泛型类型必须允许改名但保留签名：
-keep,allowobfuscation,allowshrinking class io.reactivex.Observable
-keep,allowobfuscation,allowshrinking class io.reactivex.Flowable
-keep,allowobfuscation,allowshrinking class io.reactivex.Single
-keep,allowobfuscation,allowshrinking class io.reactivex.Maybe
-keep,allowobfuscation,allowshrinking class io.reactivex.Completable
-keep,allowobfuscation,allowshrinking class okhttp3.ResponseBody
-keep,allowobfuscation,allowshrinking class retrofit2.Response
-keep,allowobfuscation,allowshrinking class retrofit2.Call

# 【已踩坑，勿回退】不要再用 Kotlin suspend 声明 Retrofit 接口方法。
# R8（AGP 9 内置版本）重写方法泛型签名时，会把 suspend 方法编译器生成的
# `Continuation<? super String>` 参数的实参丢掉，dex 里只剩裸 `Lkotlin/coroutines/c;`，
# 但 `-keepattributes Signature` 仍保留该属性 —— 规则层面无法阻止这种「保留属性但降级为裸类型」。
# 后果：Retrofit 解析时 `(ParameterizedType)` 强转抛
# `java.lang.Class cannot be cast to java.lang.reflect.ParameterizedType`，
# release 包整条请求链路静默失败（板块在线更新、消息、个人资料、过滤词）。
# 现行做法：接口统一返回 `Call<String>`，协程桥接放在 RetrofitServiceKt.kt 的 `awaitString()` 扩展里。
# 已用 dexdump 校验：改造前 dex 注解表里是裸 Continuation，改造后不再有 Continuation 参数。

# 保留Kotlin标准库相关类
#-keep class kotlin.** { *; }
#-keep class kotlinx.** { *; }

-keep class com.justwen.androidnga.base.network.retrofit.RetrofitService { *;}
-keep class com.justwen.androidnga.base.network.retrofit.RetrofitServiceKt { *;}

-dontwarn androidx.compose.animation.tooling.ComposeAnimation
-dontwarn androidx.compose.animation.tooling.ComposeAnimationType
-dontwarn javax.lang.model.element.Element

-dontwarn androidx.window.extensions.WindowExtensions
-dontwarn androidx.window.extensions.WindowExtensionsProvider
-dontwarn androidx.window.extensions.layout.WindowLayoutComponent
-dontwarn androidx.window.sidecar.SidecarDisplayFeature