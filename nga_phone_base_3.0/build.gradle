plugins {
    id 'com.android.application'
    alias(libs.plugins.ksp)
    alias(libs.plugins.compose.compiler)
}


def static getDate() {
    def date = new Date()
    def formattedDate = date.format('yyyyMMddHHmm')
    return formattedDate
}

def isJenkins() {
    return project.hasProperty('IS_JENKINS') && IS_JENKINS == 'true'
}

android {
    namespace "gov.anzong.androidnga"
    compileSdk project.compileSdkVersion
    compileSdkMinor project.compileSdkMinor

    signingConfigs {
        release {
            keyAlias 'jgw'
            keyPassword '123456'
            storeFile file(jks_path)
            storePassword '123456'
        }
    }

    defaultConfig {
        applicationId "gov.anzong.androidnga"
        minSdkVersion project.minSdkVersion
        targetSdkVersion project.targetSdkVersion
        resConfigs "zh", "en"

        versionCode project.appVersionCode
        versionName project.appVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }
        vectorDrawables {
            useSupportLibrary true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            zipAlignEnabled true
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        disable.add('MissingTranslation')
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// AGP 9 已移除 applicationVariants.outputFileName 的改写能力，
// 改为在 assembleRelease 结束后按原有规则给产物改名
tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'renameReleaseApk'
}

tasks.register('renameReleaseApk') {
    doLast {
        def apkDir = layout.buildDirectory.dir('outputs/apk/release').get().asFile
        if (!apkDir.isDirectory()) {
            return
        }
        def datedName = "nga_phone_${project.appVersionName}_${getDate()}.apk"
        apkDir.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('-release.apk')) {
                def target = new File(apkDir, datedName)
                if (target.exists()) {
                    target.delete()
                }
                if (!f.renameTo(target)) {
                    logger.warn("rename ${f.name} -> ${target.name} failed")
                }
            }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {

    implementation "com.google.android.material:material:$androidx_material_version"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"

    implementation 'commons-io:commons-io:2.22.0'

    // lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // compose 相关（AGP 9 下 R 字段不再是常量，ButterKnife 已全量移除）
    implementation 'androidx.compose.material3:material3-android:1.5.0'
    implementation 'androidx.compose.animation:animation-android:1.13.0'

    //compose
    implementation "androidx.activity:activity-compose:$compose_activity_version"
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation "androidx.compose.material:material:$compose_version"
