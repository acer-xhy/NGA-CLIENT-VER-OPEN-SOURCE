def static getDate() {
    def date = new Date()
    def formattedDate = date.format('yyyyMMddHHmm')
    return formattedDate
}

def isJenkins() {
    return project.hasProperty('IS_JENKINS') && IS_JENKINS == 'true'
}

// —— 签名信息不写入仓库 ——
// Android 官方《为应用签名》：签名信息以明文留在 build.gradle 里，开源/协作场景必须移出。
// 读取优先级：环境变量 > keystore.properties（项目根，勿入库）> Gradle 项目属性
//             （-P / ORG_GRADLE_PROJECT_* / ~/.gradle/gradle.properties）
// storeFile 未显式配置时回退到根 build.gradle 的 jks_path（相对本模块目录）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}

def resolveSigningValue = { String envName, String propertyName ->
    def fromEnv = System.getenv(envName)
    if (fromEnv != null && fromEnv.trim()) {
        return fromEnv.trim()
    }
    def fromFile = keystoreProperties.getProperty(propertyName)
    if (fromFile != null && fromFile.trim()) {
        return fromFile.trim()
    }
    def fromProject = project.findProperty(propertyName)
    if (fromProject != null && fromProject.toString().trim()) {
        return fromProject.toString().trim()
    }
    return null
}

def signingStoreFile = resolveSigningValue('NGA_STORE_FILE', 'storeFile') ?: jks_path
def signingStorePassword = resolveSigningValue('NGA_STORE_PASSWORD', 'storePassword')
def signingKeyAlias = resolveSigningValue('NGA_KEY_ALIAS', 'keyAlias')
def signingKeyPassword = resolveSigningValue('NGA_KEY_PASSWORD', 'keyPassword')
def signingReady = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword \
        && file(signingStoreFile).exists()

android {
    namespace "gov.anzong.androidnga"
    compileSdk project.compileSdkVersion
    compileSdkMinor project.compileSdkMinor

    signingConfigs {
        if (signingReady) {
            release {
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
            }
        }
    }

    defaultConfig {
        applicationId "gov.anzong.androidnga"
        minSdkVersion project.minSdkVersion
        targetSdkVersion project.targetSdkVersion
        resConfigs "zh", "en"

        versionCode project.appVersionCode
        versionName project.appVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }
        vectorDrawables {
            useSupportLibrary true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            zipAlignEnabled true
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        disable.add('MissingTranslation')
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// release 构建必须有真实签名：缺配置时在任务图上直接失败，避免产出 unsigned 包被当成正式包发出去
gradle.taskGraph.whenReady { graph ->
    def requestsRelease = graph.allTasks.any {
        it.name in ['assembleRelease', 'bundleRelease', 'installRelease', 'packageRelease']
    }
    if (requestsRelease && !signingReady) {
        throw new GradleException(
                "release 构建缺少可用的签名配置，任选其一：\n" +
                "  1) 在项目根创建 keystore.properties（勿入库，已在 .gitignore），内容：\n" +
                "       storeFile=../keystore/nga.jks\n" +
                "       storePassword=<你的 keystore 密码>\n" +
                "       keyAlias=<你的 key 别名>\n" +
                "       keyPassword=<你的 key 密码>\n" +
                "  2) 设置环境变量 NGA_STORE_PASSWORD / NGA_KEY_ALIAS / NGA_KEY_PASSWORD（可选 NGA_STORE_FILE）；\n" +
                "  3) 用 -P 或在 ~/.gradle/gradle.properties 里写 storePassword / keyAlias / keyPassword。")
    }
}

// AGP 9 已移除 applicationVariants.outputFileName 的改写能力，
// 改为在 assembleRelease 结束后按原有规则给产物改名
tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'renameReleaseApk'
}

tasks.register('renameReleaseApk') {
    doLast {
        def apkDir = layout.buildDirectory.dir('outputs/apk/release').get().asFile
        if (!apkDir.isDirectory()) {
            return
        }
        def datedName = "nga_phone_${project.appVersionName}_${getDate()}.apk"
        apkDir.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('-release.apk')) {
                def target = new File(apkDir, datedName)
                if (target.exists()) {
                    target.delete()
                }
                if (!f.renameTo(target)) {
                    logger.warn("rename ${f.name} -> ${target.name} failed")
                }
            }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
}

