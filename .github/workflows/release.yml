name: Release APK

# 只在 tag 上触发。用 '*' 而不是字符类，避免 filter 语法差异导致数字 tag 漏触发；
# 真正的格式校验（必须 x.y.z 或 vx.y.z）由 job 第一步负责，打错 tag 会立即失败
on:
  push:
    tags:
      - '*'

permissions:
  contents: write          # gh release create 需要写权限，缺了会 403

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  MODULE: nga_phone_base_3.0
  # 默认出草稿：产物先人工装一次再 Publish。确认流程稳定后改成 'false' 即可全自动
  DRAFT: 'true'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码（含 tag 与完整历史）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # 本工程 AGP 9.5.2 / Gradle 9.9.2，本机已用 JVM 25 验证通过；源码 target 仍是 17，不受影响
      - name: 安装 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # —— 版本门禁：tag、versionName、versionCode 三者必须对齐，否则直接失败 ——
      - name: 校验 tag 与版本号一致性
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' 不符合 x.y.z 或 vx.y.z 格式"; exit 1
          fi
          IFS=. read -r MA MI PA <<< "$VERSION"
          # 版本号规则（与根 build.gradle 的 versionNameToCode 完全一致）：
          #   versionCode = MAJOR*1,000,000 + MINOR*1,000 + PATCH，例 6.0.0 -> 6000000
          # 约束：MINOR/PATCH 取 0-999，versionCode 不超过 2,100,000,000
          MI=$((10#$MI))
          PA=$((10#$PA))
          if [ "$MI" -gt 999 ] || [ "$PA" -gt 999 ]; then
            echo "::error::versionName 的 MINOR/PATCH 不得超过 999"; exit 1
          fi
          EXPECTED_CODE=$((10#$MA * 1000000 + MI * 1000 + PA))
          if [ "$EXPECTED_CODE" -gt 2100000000 ]; then
            echo "::error::versionCode $EXPECTED_CODE 超出 2,100,000,000"; exit 1
          fi
          NAME=$(grep -oP "appVersionName\s*=\s*'\K[^']+" build.gradle | head -1)
          CODE=$(grep -oP "appVersionCode\s*=\s*\K[0-9]+" build.gradle | head -1)
          echo "tag=$TAG version=$VERSION expectedCode=$EXPECTED_CODE gradleName=$NAME gradleCode=$CODE"
          [ "$NAME" = "$VERSION" ] || { echo "::error::build.gradle appVersionName=$NAME 与 tag $VERSION 不一致"; exit 1; }
          [ "$CODE" = "$EXPECTED_CODE" ] || { echo "::error::build.gradle appVersionCode=$CODE 与推导值 $EXPECTED_CODE 不一致"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "EXPECTED_CODE=$EXPECTED_CODE" >> "$GITHUB_ENV"

      # 本工程 compileSdk=37、compileSdkMinor=1，runner 预装 SDK 不一定有，需要显式安装；
      # runner 自带 SDK 但 cmdline-tools 的 bin 不在 PATH，直接用 sdkmanager 会 127
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BIN="$SDK/cmdline-tools/latest/bin"
          echo "SDK=$SDK"
          [ -x "$BIN/sdkmanager" ] || { echo "::error::未找到 sdkmanager：$BIN"; ls -R "$SDK/cmdline-tools" 2>/dev/null || true; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export PATH="$BIN:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" > /dev/null
          # 本工程 compileSdk=37 + compileSdkMinor=1，真正需要的是 platforms;android-37.1
          # （SDK 里不存在裸的 platforms;android-37，只有 37.0 / 37.1 / 37.2）
          sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0" > /dev/null 2>&1 \
            || echo "::warning::android-37.1 安装失败，尝试使用 runner 已有 SDK"
          sdkmanager --list_installed | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" || true

      # keystore 不入库（已在 .gitignore），CI 从 secret 还原；密码同样只走 secret，
      # 仓库里的 build.gradle 已不含任何明文凭据
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::缺少 secret KEYSTORE_BASE64"; exit 1; }
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/nga.jks
          test -s keystore/nga.jks || { echo "::error::keystore 还原失败"; exit 1; }
          echo "keystore ok: $(stat -c%s keystore/nga.jks) bytes"

      # 签名凭据全部来自 repository secrets，缺失时明确失败，绝不回落到任何写死的值
      - name: 检查签名 secret 是否就绪
        env:
          NGA_STORE_PASSWORD: ${{ secrets.NGA_STORE_PASSWORD }}
          NGA_KEY_ALIAS: ${{ secrets.NGA_KEY_ALIAS }}
          NGA_KEY_PASSWORD: ${{ secrets.NGA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for k in NGA_STORE_PASSWORD NGA_KEY_ALIAS NGA_KEY_PASSWORD; do
            if [ -z "${!k}" ]; then
              echo "::error::缺少 secret $k（Settings → Secrets and variables → Actions）"; exit 1
            fi
          done
          echo "签名 secret 已就绪"

      - name: 构建 release APK
        env:
          NGA_STORE_PASSWORD: ${{ secrets.NGA_STORE_PASSWORD }}
          NGA_KEY_ALIAS: ${{ secrets.NGA_KEY_ALIAS }}
          NGA_KEY_PASSWORD: ${{ secrets.NGA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --max-workers=4 assembleRelease --stacktrace

      # —— 产物门禁：从 APK 里读回 versionName/versionCode 并验签，避免“打错包/错签”发出去 ——
      - name: 校验产物版本号与签名
        run: |
          set -euo pipefail
          APK=$(ls "$MODULE"/build/outputs/apk/release/nga_phone_"${VERSION}"_*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::warning::未找到重命名后的产物，回退到默认命名"
            APK=$(ls "$MODULE"/build/outputs/apk/release/*-release.apk 2>/dev/null | head -1 || true)
          fi
          [ -n "$APK" ] || { echo "::error::未找到 APK 产物"; ls -R "$MODULE"/build/outputs/apk || true; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "apk=$APK size=$(stat -c%s "$APK") bytes"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT"/aapt2 dump badging "$APK" | head -1)
          echo "$BADGING"
          grep -q "versionName='${VERSION}'" <<< "$BADGING" || { echo "::error::产物 versionName 与 tag 不一致"; exit 1; }
          grep -q "versionCode='${EXPECTED_CODE}'" <<< "$BADGING" || { echo "::error::产物 versionCode 应为 ${EXPECTED_CODE}"; exit 1; }
          "$BT"/apksigner verify --print-certs "$APK"

      - name: 打包 mapping 与 native 符号
        run: |
          set -euo pipefail
          MAP="$MODULE/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAP" ]; then
            (cd "$(dirname "$MAP")" && zip -q "$GITHUB_WORKSPACE/mapping-${VERSION}.zip" mapping.txt)
            echo "MAPPING_ZIP=mapping-${VERSION}.zip" >> "$GITHUB_ENV"
            echo "mapping 已打包"
          else
            echo "::warning::未找到 mapping.txt（minify 未生效？）"
          fi
          NS="$MODULE/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          if [ -f "$NS" ]; then
            cp "$NS" "$GITHUB_WORKSPACE/native-debug-symbols-${VERSION}.zip"
            echo "SYMBOLS_ZIP=native-debug-symbols-${VERSION}.zip" >> "$GITHUB_ENV"
          fi

      - name: 备份产物到 Actions
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ github.ref_name }}
          path: |
            nga_phone_base_3.0/build/outputs/apk/release/*.apk
            mapping-*.zip
            native-debug-symbols-*.zip
          if-no-files-found: error

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARGS=("$GITHUB_REF_NAME" "$APK" --verify-tag --generate-notes --title "NGA ${VERSION}")
          # 注意：set -e 下不能用 "[ cond ] && cmd"，条件为假会让整个 step 退出，必须用 if
          if [ "$DRAFT" = "true" ]; then ARGS+=(--draft); fi
          if [ -n "${MAPPING_ZIP:-}" ]; then ARGS+=("$MAPPING_ZIP"); fi
          if [ -n "${SYMBOLS_ZIP:-}" ]; then ARGS+=("$SYMBOLS_ZIP"); fi
          echo "gh release create ${ARGS[*]}"
          gh release create "${ARGS[@]}"
          gh release view "$GITHUB_REF_NAME" --json name,isDraft,assets
