name: Build Artifacts

# 日常分支构建：只出 debug 包做冒烟验证，不涉及签名与发布
on:
  push:
    branches: [ master, build-test ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE: nga_phone_base_3.0

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout project sources
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 原配置为 JDK 17，与 AGP 9.5.2 / Gradle 9.9.2 的构建环境不一致，已统一到 25
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # runner 自带 Android SDK，但 cmdline-tools 的 bin 不在 PATH 里，直接用 sdkmanager 会 127
    - name: Setup Android SDK
      run: |
        set -euo pipefail
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        BIN="$SDK/cmdline-tools/latest/bin"
        echo "SDK=$SDK"
        [ -x "$BIN/sdkmanager" ] || { echo "::error::未找到 sdkmanager：$BIN"; ls -R "$SDK/cmdline-tools" 2>/dev/null || true; exit 1; }
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        export PATH="$BIN:$SDK/platform-tools:$PATH"
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager --install "platform-tools" > /dev/null
        sdkmanager --install "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 \
          || sdkmanager --install "platforms;android-37" "build-tools;37.0.0" --channel=3 > /dev/null 2>&1 \
          || echo "::warning::android-37 安装失败，尝试使用 runner 已有 SDK"
        # compileSdkMinor=1 需要 37.1 平台包；装不到就让 Gradle 报缺，不掩盖
        sdkmanager --install "platforms;android-37.1" > /dev/null 2>&1 || echo "android-37.1 包不可用，继续"
        sdkmanager --list_installed | grep -E "platforms;android-3[5-9]|build-tools;3[5-9]" || true

    - name: Build APK
      run: ./gradlew --no-daemon --max-workers=4 assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nga-debug-apk
        path: nga_phone_base_3.0/build/outputs/apk/debug/*.apk
        if-no-files-found: error
