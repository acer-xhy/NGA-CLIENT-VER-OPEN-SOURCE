## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Tue Aug 22 08:32:17 CST 2017
# 本机 14 核 20 线程 / 16GB 内存：R8 与资源合并是内存大户，堆给到 4G，
# 并显式用 ParallelGC（短命对象多，比 G1 的并发开销更适合构建场景）
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Kotlin 编译守护进程是独立 JVM，多模块 Kotlin 任务并行时要各自占用堆，单独给到 3G
kotlin.daemon.jvmargs=-Xmx3g -XX:ReservedCodeCacheSize=512m
# 13 个模块的编译/资源任务并行调度（此前未开启，模块间任务只能串行）
org.gradle.parallel=true
# 14 物理核 20 逻辑线程：20 个 worker 会互相抢占，实测 14 更快，也给 AS 留出余量
org.gradle.workers.max=14
# 本地构建缓存：clean 之后重复打包可直接复用 merge/compile/kapt 输出
org.gradle.caching=true
org.gradle.configureondemand=false
android.injected.testOnly=false
android.useAndroidX=true
android.enableJetifier=true
# kapt 全量处理。Room 已迁到 KSP，这里不再是规避 Room NPE；
# 保留 false 是因为 ARouter 的处理器不支持增量（每次都会全量重建路由表），
# 开增量只会多一层记录开销，且历史上有过漏产路由表的风险
kapt.incremental.apt=false
# 说明：daemon 用的 JDK 25 由本机 gradle/gradle-daemon-jvm.properties 声明（该文件已被 .gitignore 忽略），
# 本机 JDK 安装路径属于机器相关配置，放在 ~/.gradle/gradle.properties 里，不入库。
