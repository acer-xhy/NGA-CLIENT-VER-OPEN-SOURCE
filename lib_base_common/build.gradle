plugins {
    id 'com.android.library'
}

android {
    namespace 'gov.anzong.androidnga.common'

    compileSdk project.compileSdkVersion
    compileSdkMinor 1

    defaultConfig {
        minSdkVersion project.minSdkVersion
        targetSdkVersion project.targetSdkVersion
        versionCode 1
        versionName "1.0"

        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation "com.google.android.material:material:$androidx_material_version"
    implementation "androidx.appcompat:appcompat:$appcompat_version"

    api 'com.vanniktech:rxpermission:0.11.0'
    api "io.reactivex.rxjava2:rxjava:$rxjava_version"
    implementation 'net.steamcrafted:load-toast:1.0.12'
    implementation 'com.github.GrenderG:Toasty:1.5.2'

    api(libs.fastjson2)

    api "io.reactivex.rxjava2:rxandroid:$project.rxAndroid"

    implementation 'commons-io:commons-io:2.22.0'

    api("com.google.guava:guava:33.8.0-android")

    // kotlin
    implementation "androidx.core:core-ktx:$core_ktx_version"

    //retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"

    //noinspection KtxExtensionAvailable
    implementation "androidx.preference:preference:$preference_version"
}
