pluginManagement {
    repositories {
        // 阿里云镜像只服务于本地网络；GitHub runner 上实测返回 502，CI 直接走官方源
        if (System.getenv('CI') != 'true') {
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/central' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // 本地找不到声明的工具链版本时，允许 Gradle 自动下载对应 JDK
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include ':lib_bu_statistics'
include ':nga_phone_base_3.0'
include ':lib_core'
include ':lib_base_logger'
include ':lib_base_common'
include ':lib_core_data'
include ':lib_bu_message'
include ':lib_base_network'
include ':lib_base_service_api'
include ':lib_bu_account'
include ':lib_base_ui_compose'
include ':lib_base_ui'
include ':lib_module_debug'
