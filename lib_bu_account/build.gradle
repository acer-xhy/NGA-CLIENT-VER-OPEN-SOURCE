plugins {
    id 'com.android.library'
    alias(libs.plugins.android.legacy.kapt)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.client.androidnga.account'
    compileSdk project.compileSdkVersion
    compileSdkMinor project.compileSdkMinor

    defaultConfig {
        minSdkVersion project.minSdkVersion
        targetSdkVersion project.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        kapt {
            arguments {
                arg("AROUTER_MODULE_NAME", project.getName())
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation project(':lib_base_common')
    implementation libs.material3
    testImplementation 'junit:junit:4.13.2'

    implementation "com.alibaba:arouter-api:$arouter_version"
    kapt "com.alibaba:arouter-compiler:$arouter_version"

    implementation project(':lib_base_service_api')

    implementation project(':lib_base_ui_compose')

    implementation project(':lib_base_network')

    implementation project(':lib_core')
    implementation project(':lib_core_data')

    // database：Room 已迁到 KSP（kapt 只剩 ARouter），KSP 可直接处理 Java 的 Entity/DAO/Database。
    // room-runtime 用 api：AppDatabase 继承 RoomDatabase，类型要暴露给 app 的 javac 编译
    api "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
}